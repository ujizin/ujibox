[project]
site_name = "ujibox"
site_description = "Build, store and install Android and iOS apps on emulators and simulators."
repo_url = "https://github.com/ujizin/ujibox"
repo_name = "ujizin/ujibox"
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Get started" = "getting-started.md" },
  { "Commands" = "commands.md" },
  { "Select devices" = "devices.md" },
  { "Project files" = "projects.md" },
  { "Desktop and web apps" = "desktop-web.md" },
  { "Build store" = "store.md" },
  { "Sync and the ujibox app" = "sync.md" },
  { "The ujibox app" = "app.md" },
  { "Agent skills" = "skills.md" },
  { "Troubleshooting" = "troubleshooting.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
